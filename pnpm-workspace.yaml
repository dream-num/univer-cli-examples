packages:
  - examples/*

# Each example keeps its own lockfile so its exact version combination stays
# frozen and upgradeable independently (examples can also be copied out and
# installed standalone).
sharedWorkspaceLockfile: false

# SDK releases are verified fresh from our insider registry before publication,
# so every Univer package consumed here is exempt from pnpm's default minimum
# release age. List full package names: a scope wildcard would also exempt any
# future or attacker-published package under the scope.
