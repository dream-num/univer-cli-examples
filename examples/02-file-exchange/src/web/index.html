<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Operations</title>
  </head>
  <body>
    <div id="shell">
      <aside id="sidebar">
        <header class="sidebar-brand">
          <span class="brand-mark" aria-hidden="true">U</span>
          <span>Univer CLI</span>
        </header>
        <section class="sidebar-section">
          <h2>Files</h2>
          <form id="create-form">
            <select id="create-type" aria-label="File type">
              <option value="sheet">Sheet</option>
              <option value="doc">Doc</option>
              <option value="slide">Slide</option>
            </select>
            <button type="submit">New</button>
          </form>
          <nav id="unit-list" aria-label="Files"></nav>
        </section>
      </aside>
      <main id="workspace">
        <div id="status">Select a file</div>
        <div id="empty">Select a file or create a new one.</div>
        <div id="app"></div>
      </main>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
