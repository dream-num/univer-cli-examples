<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Gen CLI</title>
  </head>
  <body>
    <div id="shell">
      <aside id="sidebar">
        <header class="sidebar-brand">
          <span class="brand-mark" aria-hidden="true">U</span>
          <span>Slide Gen CLI</span>
        </header>
        <section class="sidebar-section">
          <h2>Files</h2>
          <form id="create-form">
            <button type="submit">New Slide</button>
          </form>
          <nav id="unit-list" aria-label="Files"></nav>
        </section>
        <section class="sidebar-section worktree-section">
          <h2>Worktrees</h2>
          <nav id="worktree-list" aria-label="Worktrees"></nav>
        </section>
      </aside>
      <main id="workspace">
        <div id="toolbar">
          <span id="status">Select a file</span>
          <div id="review-actions"></div>
        </div>
        <div id="empty">Select a file or create a new one.</div>
        <div id="app"></div>
      </main>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
