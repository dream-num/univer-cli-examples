name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Guards main: a -next branch carries an insider .npmrc, and possibly pre-release SDK
  # versions, until the SDK release is public, so this job runs only where that must not land.
  merge-gate:
    name: Merge gate - private registry
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail if a pre-release Univer SDK version is pinned
        run: |
          status=0
          while IFS= read -r file; do
            while IFS= read -r line; do
              echo "::error file=$file::Pre-release Univer SDK version is pinned: $line"
              status=1
            done < <(grep -nE '@univer(js|js-pro|-cli)/.*[0-9]-(insiders|dev|nightly|alpha|beta|rc|experimental)[.-]' "$file" || true)
          done < <(git ls-files -- 'package.json' '*/package.json' 'pnpm-workspace.yaml')
          if [ "$status" -ne 0 ]; then
            echo "main depends only on publicly released SDK versions. Replace them with the released versions before merging into main."
          fi
          exit $status

      - name: Fail if a private registry is committed
        run: |
          status=0
          while IFS= read -r file; do
            while IFS= read -r line; do
              url=${line#*=}
              if [ "$url" != "https://registry.npmjs.org" ] && [[ "$url" != https://registry.npmjs.org/* ]]; then
                echo "::error file=$file::Private npm registry is committed: $url"
                status=1
              fi
            done < <(grep -E '^[^#]*registry[[:space:]]*=' "$file" || true)
          done < <(git ls-files -- '*.npmrc')
          if [ "$status" -ne 0 ]; then
            echo "Before merging into main, all npm packages must be promoted to the public npm registry and the private registry config must be removed."
          fi
          exit $status

  check:
    name: Check ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/01-content-operations
          - examples/02-file-exchange
          - examples/03-visual-inspection
          - examples/04-worktree

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.example }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir ${{ matrix.example }} install --frozen-lockfile

      - name: Check
        run: pnpm --dir ${{ matrix.example }} check
