name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/01-content-operations
          - examples/02-file-exchange
          - examples/03-visual-inspection
          - examples/04-worktree

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.example }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir ${{ matrix.example }} install --frozen-lockfile

      - name: Check
        run: pnpm --dir ${{ matrix.example }} check
